<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Engage</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <p class="mark">Engage</p>
      <nav>
        <button id="nav-start" type="button">Start</button>
        <button id="nav-settings" type="button">Settings</button>
      </nav>
      <h1 id="title">Start</h1>
      <p class="lede" id="status">Checking the local server.</p>
    </header>

    <section id="start">
      <ol>
        <li>Open the person's LinkedIn profile.</li>
        <li>Open Activity and scroll. The panel on the page saves each post.</li>
        <li>Open one post. Then write a comment.</li>
      </ol>
      <button id="go-comment" type="button" hidden>Write a comment on this post</button>
    </section>

    <section id="settings" hidden>
      <div id="memory-list"></div>
    </section>

    <section id="actions" hidden>
      <button id="read" type="button" hidden>Update voice from the posts on screen</button>
      <p class="hint" id="read-hint" hidden>Scroll the profile yourself. Older posts load as you go. Nothing is posted.</p>

      <label class="field" id="voice-field" hidden>
        Voice
        <select id="voice"></select>
      </label>
      <label class="check" id="live-field" hidden>
        <input id="live" type="checkbox" checked />
        Ask Gemini for the wording
      </label>
      <button id="draft" type="button" hidden>Draft a comment in this voice</button>
    </section>

    <section id="capture" hidden>
      <h2 id="capture-name"></h2>
      <ul id="observations"></ul>
      <div id="examples"></div>
      <p class="hint" id="memory-note"></p>
    </section>

    <section id="result" hidden>
      <h2 id="result-title"></h2>
      <p id="result-body"></p>
      <div id="review" hidden>
        <button id="keep" type="button">Keep</button>
        <button id="change" type="button">Change</button>
        <button id="drop" type="button">Drop</button>
        <div id="edit-box" hidden>
          <label class="field">
            Your sentence
            <textarea id="edit-text" rows="3"></textarea>
          </label>
          <label class="field">
            Remember this next time
            <input id="edit-rule" type="text" />
          </label>
          <button id="save-edit" type="button">Save my sentence</button>
        </div>
      </div>
    </section>

    <script src="content.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
